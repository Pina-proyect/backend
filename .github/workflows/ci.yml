# CI de PINA Backend: ejecuta tests unitarios y e2e con Yarn
# Este workflow levanta Postgres como servicio, genera Prisma Client,
# aplica migraciones y corre los tests. No expone secretos.

name: CI

on:
  push:
    branches: [ "master", "main", "testing" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # El repo de GitHub tiene el código en la raíz (package.json, src/, prisma/).
    # Sin working-directory: los comandos corren en la raíz del checkout.

    # Servicio de Postgres para tests. Evita depender de bases locales.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pina_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pina_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Variables de entorno para la ejecución de tests.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pina_ci
      NODE_ENV: test

    steps:
      # 1) Checkout del código
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Configurar Node
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # El repo usa Yarn Classic (lockfile v1). El runner ya trae yarn 1.22.x,
      # por eso no activamos Corepack/Berry aquí.

      # 3) Cache de node_modules
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-backend-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-yarn-

      # 4) Instalar dependencias de forma reproducible
      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      # 5) Esperar que Postgres esté listo
      - name: Esperar Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Postgres aún no está listo. Esperando..."
            sleep 2
          done

      # 6) Generar Prisma Client
      - name: Generar Prisma Client
        run: yarn prisma generate

      # 7) Aplicar migraciones a la base de pruebas
      - name: Aplicar migraciones
        run: yarn prisma migrate deploy

      # 8) Ejecutar tests unitarios
      - name: Ejecutar tests unitarios
        run: yarn test --ci

      # 9) Ejecutar tests end-to-end
      - name: Ejecutar tests e2e
        run: yarn test:e2e --ci

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          # La acción ya agrega --fail --no-update --github-actions por defecto.
          extra_args: --no-verification

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # El repo usa Yarn Classic (lockfile v1); el runner ya trae yarn 1.22.x.

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-backend-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-yarn-

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Dependency audit
        run: yarn npm audit --all --severity high

      - name: ESLint security rules
        run: yarn lint:security
