# CI de PINA Backend: ejecuta tests unitarios y e2e con Yarn
# Este workflow levanta Postgres como servicio, genera Prisma Client,
# aplica migraciones y corre los tests. No expone secretos.

name: CI

on:
  push:
    branches: [ "master", "main", "testing" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Ejecuta todos los comandos dentro de la carpeta del proyecto
    defaults:
      run:
        working-directory: backend-nest

    # Servicio de Postgres para tests. Evita depender de bases locales.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pina_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pina_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Variables de entorno para la ejecución de tests.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pina_ci
      NODE_ENV: test

    steps:
      # 1) Checkout del código
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Configurar Node
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Habilitar Corepack
        run: corepack enable

      - name: Activar Yarn 4.11.0 con Corepack
        run: corepack prepare yarn@4.11.0 --activate

      - name: Verificar versión de Yarn
        run: yarn -v

      # 3) Cache explícito para Yarn Berry (.yarn/cache)
      - name: Cache Yarn Berry
        uses: actions/cache@v4
        with:
          path: |
            backend-nest/node_modules
            backend-nest/.yarn/cache
            backend-nest/.yarn/install-state.gz
          key: ${{ runner.os }}-backend-yarn-${{ hashFiles('backend-nest/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-yarn-

      # 4) Instalar dependencias con Yarn Berry de forma reproducible
      - name: Instalar dependencias
        run: yarn install --immutable

      # 5) Esperar que Postgres esté listo
      - name: Esperar Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Postgres aún no está listo. Esperando..."
            sleep 2
          done

      # 6) Generar Prisma Client
      - name: Generar Prisma Client
        run: yarn prisma generate

      # 7) Aplicar migraciones a la base de pruebas
      - name: Aplicar migraciones
        run: yarn prisma migrate deploy

      # 8) Ejecutar tests unitarios
      - name: Ejecutar tests unitarios
        run: yarn test --ci

      # 9) Ejecutar tests end-to-end
      - name: Ejecutar tests e2e
        run: yarn test:e2e --ci

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-nest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: backend-nest
          extra_args: --fail --no-verification

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Habilitar Corepack
        run: corepack enable

      - name: Activar Yarn 4.11.0 con Corepack
        run: corepack prepare yarn@4.11.0 --activate

      - name: Cache Yarn Berry
        uses: actions/cache@v4
        with:
          path: |
            backend-nest/node_modules
            backend-nest/.yarn/cache
            backend-nest/.yarn/install-state.gz
          key: ${{ runner.os }}-backend-yarn-${{ hashFiles('backend-nest/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-yarn-

      - name: Instalar dependencias
        run: yarn install --immutable

      - name: Dependency audit
        run: yarn npm audit --all --severity high

      - name: ESLint security rules
        run: yarn lint:security
